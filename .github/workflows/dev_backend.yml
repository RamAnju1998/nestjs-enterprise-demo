name: Backend CI Pipeline

on:
  push:
    branches:
      - develop
    # paths:
    #   - 'backend/**'

jobs:

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
    
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Lint check
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

  
  build:
    name: Build Application
    runs-on: ubuntu-latest

    needs: code-quality

    defaults:
      run:
        working-directory: backend

    steps:
    
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

  test:
    name: Unit Test
    runs-on: ubuntu-latest

    needs: build

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test