name: Backend CI Pipeline

on:
  push:
    branches:
      - develop
    # paths:
    #   - 'backend/**'

jobs:

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
    
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Lint check
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

  
  build:
    name: Build Application
    runs-on: ubuntu-latest

    needs: code-quality

    defaults:
      run:
        working-directory: backend

    steps:
    
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

  test:
    name: Unit Test
    runs-on: ubuntu-latest

    needs: build

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test


  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: test

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t nestjs-enterprise-demo .

      - name: Tag Docker Image
        run: docker tag nestjs-enterprise-demo:latest ${{ steps.login-ecr.outputs.registry }}/nestjs-enterprise-demo:latest

      - name: Push Docker Image
        run: docker push ${{ steps.login-ecr.outputs.registry }}/nestjs-enterprise-demo:latest